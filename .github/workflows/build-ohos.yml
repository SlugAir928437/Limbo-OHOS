name: Build QEMU for HarmonyOS (TCG + SDL + SPICE + VirGL)

# 为 HarmonyOS Next 版 Limbo 构建进程内 QEMU。
# 本 workflow 位于 Limbo-OHOS 仓库，构建时 checkout SlugAir928437/QEMU 源码。
#   - 客户机目标：x86_64-softmmu、aarch64-softmmu
#   - 加速器：仅 TCG（--disable-kvm；不提供 Gunyah / GZVM）
#   - 显示：SDL（ohos_sdl2）；不构建 GTK
#   - 可选栈：SPICE / VirGL / OpenGL
#   - 不构建 qemu-system-ia64
#   - 宿主 ABI：arm64-v8a（真机）与 x86_64（模拟器），同一套脚本按 matrix 分别
#     交叉编译依赖库 / SDL2 / QEMU，各自产出 entry/libs/<abi> 的原生库
#   - 随后把原生库打进 entry/libs，用 harmonyos-ci 的 API 26 command-line-tools
#     镜像（ghcr.io/dalongzhuazi/harmonyos-ci:api26r）构建 unsigned HAP
# 产物：可在运行时 dlopen 的 libqemu-system-x86_64.so / libqemu-system-aarch64.so
#     以及 QEMU 固件 pc-bios（打包进 HAP rawfile，运行时由 -L 指向私有目录）

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build-ohos.yml'
      - 'entry/**'
      - 'AppScope/**'
      - 'hvigor/**'
      - 'build-profile.json5'
      - 'oh-package.json5'
      - 'hvigorfile.ts'

env:
  SDK_ROOT: ${{ github.workspace }}/ohos-sdk
  DEPS: ${{ github.workspace }}/ohos-deps
  BUILD_ROOT: ${{ github.workspace }}/ohos-build
  # 原生库统一按 API 12（HarmonyOS NEXT 5.0.0）编译，与 compatibleSdkVersion 对齐
  OHOS_API_LEVEL: '12'
  ZLIB_VERSION: '1.3.1'
  LIBFFI_VERSION: '3.4.6'
  PCRE2_VERSION: '10.44'
  GLIB_VERSION: '2.80.5'
  PIXMAN_VERSION: '0.44.2'
  OPENSSL_VERSION: '3.0.15'
  JPEG_VERSION: '3.0.4'
  LIBDRM_VERSION: '2.4.123'
  EPOXY_VERSION: '1.5.10'
  VIRGL_VERSION: '1.0.1'
  SPICE_PROTOCOL_VERSION: '0.14.4'
  SPICE_VERSION: '0.15.2'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # 真机：arm64-v8a；模拟器：x86_64
          - arch: arm64-v8a
            triple: aarch64-unknown-linux-ohos
            openssl_target: linux-aarch64
          - arch: x86_64
            triple: x86_64-unknown-linux-ohos
            openssl_target: linux-x86_64
    env:
      OHOS_ARCH: ${{ matrix.arch }}
      CROSS_TRIPLE: ${{ matrix.triple }}
      OPENSSL_TARGET: ${{ matrix.openssl_target }}

    steps:
      - name: Checkout Limbo
        uses: actions/checkout@v4

      - name: Checkout QEMU (SlugAir928437/QEMU)
        uses: actions/checkout@v4
        with:
          repository: SlugAir928437/QEMU
          path: qemu

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build meson pkg-config cmake python3 python3-pip \
            curl ca-certificates xz-utils bzip2 file unzip autoconf automake libtool gettext git
          python3 -m pip install --upgrade 'meson>=1.3' ninja

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Cache HarmonyOS SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ohos-sdk
          key: ohos-sdk-6.0-Release-v3

      - name: Download HarmonyOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$SDK_ROOT"
          URLS=(
            "https://repo.huaweicloud.com/harmonyos/os/6.0-Release/ohos-sdk-windows_linux-public.tar.gz"
            "https://repo.huaweicloud.com/harmonyos/os/5.1.0-Release/ohos-sdk-windows_linux-public.tar.gz"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.1-Release/ohos-sdk-windows_linux-public.tar.gz"
          )
          for url in "${URLS[@]}"; do
            echo "trying ${url}"
            if curl -L --retry 3 --fail -o /tmp/ohos-sdk.tar.gz "$url"; then
              echo "$url" > "$SDK_ROOT/sdk-url.txt"
              break
            fi
          done
          test -f /tmp/ohos-sdk.tar.gz
          file /tmp/ohos-sdk.tar.gz
          # tar -xf 自动识别 gzip/xz
          tar -xf /tmp/ohos-sdk.tar.gz -C "$SDK_ROOT"
          rm -f /tmp/ohos-sdk.tar.gz

          # 包里 linux/ 下是各组件 zip（native/ets/js/toolchains/previewer），
          # 解压后删除 zip，减少缓存体积；windows 组件不处理。
          LINUX_DIR="$(find "$SDK_ROOT" -type d -name linux -print -quit)"
          test -n "$LINUX_DIR"
          shopt -s nullglob
          for zip in "$LINUX_DIR"/*.zip; do
            echo "unzip $(basename "$zip")"
            unzip -q -o "$zip" -d "$LINUX_DIR"
            rm -f "$zip"
          done
          ls -la "$LINUX_DIR" | sed -n '1,40p'
          if [ ! -d "$LINUX_DIR/native/llvm/bin" ]; then
            echo "解压后仍未找到 linux/native/llvm/bin，SDK 目录树：" >&2
            find "$SDK_ROOT" -maxdepth 4 -type d -print | sed -n '1,80p' >&2
            exit 1
          fi
          du -sh "$SDK_ROOT"

      - name: Locate HarmonyOS NDK
        run: |
          set -euo pipefail
          # 缓存或旧流程可能留下未解压的组件 zip，这里补一次
          while IFS= read -r -d '' zip; do
            echo "unzip cached component $(basename "$zip")"
            unzip -q -o "$zip" -d "$(dirname "$zip")"
            rm -f "$zip"
          done < <(find "$SDK_ROOT" -type f -name '*.zip' -path '*/linux/*' -print0)

          # 优先 linux/native（包里同时含 windows/native）
          NDK="$(find "$SDK_ROOT" -type d -path '*/linux/native' -print -quit)"
          if [ -z "$NDK" ]; then
            NDK="$(find "$SDK_ROOT" -type d -name native -print -quit)"
          fi
          if [ -z "$NDK" ]; then
            echo "未找到 NDK，SDK 目录树：" >&2
            find "$SDK_ROOT" -maxdepth 5 -type d -print | sed -n '1,120p' >&2
            exit 1
          fi
          test -d "$NDK/llvm/bin"
          test -d "$NDK/sysroot"

          # 该 SDK 是否提供当前 matrix 的宿主 ABI（x86_64 需要模拟器支持）
          ABI_TRIPLE="${CROSS_TRIPLE%%-*}-linux-ohos"
          if [ ! -d "$NDK/sysroot/usr/lib/$ABI_TRIPLE" ] || [ ! -d "$NDK/llvm/lib/$ABI_TRIPLE" ]; then
            echo "当前 HarmonyOS SDK 不包含 $ABI_TRIPLE（OHOS_ARCH=$OHOS_ARCH）" >&2
            find "$NDK/sysroot/usr/lib" -maxdepth 1 -type d -print >&2
            exit 1
          fi
          echo "OHOS_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          LLVM_BIN="$NDK/llvm/bin"
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/.ohos-toolchain/bin"
          mkdir -p "$TOOLCHAIN_BIN"

          # 带 API 版本的目标三元组：clang 识别 aarch64-unknown-linux-ohos12.0.0（
          # x86_64-unknown-linux-ohos12.0.0 同理），从而按 API 12 的头文件/可用性
          # 规则编译；旧 NDK 不接受时回退为无版本三元组
          OHOS_TARGET_TRIPLE="${CROSS_TRIPLE}${OHOS_API_LEVEL}.0.0"
          if ! echo 'int limbo_api_probe;' | "$LLVM_BIN/clang" --target="$OHOS_TARGET_TRIPLE" \
              --sysroot="$NDK/sysroot" -x c -fsyntax-only - >/dev/null 2>&1; then
            echo "::warning::当前 NDK 不支持带 API 版本的目标三元组，回退为 $CROSS_TRIPLE"
            OHOS_TARGET_TRIPLE="$CROSS_TRIPLE"
          fi
          echo "OHOS_TARGET_TRIPLE=$OHOS_TARGET_TRIPLE" >> "$GITHUB_ENV"

          # 优先沿用 SDK 自带的 <triple>-clang 驱动（带 OHOS 专有的头文件/宏配置），
          # 仅在其外层包一层强制 -fPIC（QEMU 目标文件最终要链接成 .so）。
          if [ -x "$LLVM_BIN/${CROSS_TRIPLE}-clang" ]; then
            REAL_CC="$LLVM_BIN/${CROSS_TRIPLE}-clang"
            REAL_CXX="$LLVM_BIN/${CROSS_TRIPLE}-clang++"
            BASE_FLAGS=""
          else
            echo "SDK 中没有 ${CROSS_TRIPLE}-clang，使用 clang + 显式 target/sysroot"
            REAL_CC="$LLVM_BIN/clang"
            REAL_CXX="$LLVM_BIN/clang++"
            BASE_FLAGS="--target=$OHOS_TARGET_TRIPLE --sysroot=$NDK/sysroot"
          fi

          for tool in clang clang++; do
            if [ "$tool" = "clang" ]; then
              REAL_COMPILER="$REAL_CC"
            else
              REAL_COMPILER="$REAL_CXX"
            fi
            cat > "$TOOLCHAIN_BIN/${CROSS_TRIPLE}-${tool}" <<EOF
          #!/bin/bash
          # 交叉编译不允许搜索宿主系统头文件：部分依赖经 CMake 探测会把
          # -I/usr/include 注入编译命令，宿主 glibc 的 stdint.h 会抢在 OHOS
          # sysroot 之前被使用，进而找不到 bits/libc-header-start.h。
          args=()
          for a in "\$@"; do
              case "\$a" in
                  -I/usr/include*|-I/usr/local/include*|-isystem/usr/include*|-isystem/usr/local/include*|-idirafter/usr/include*|-idirafter/usr/local/include*)
                      continue
                      ;;
              esac
              args+=("\$a")
          done
          exec "$REAL_COMPILER" $BASE_FLAGS "\${args[@]}" -fPIC
          EOF
            chmod +x "$TOOLCHAIN_BIN/${CROSS_TRIPLE}-${tool}"
          done

          # QEMU configure 通过 cross-prefix 查找 gcc/g++/ar/nm/ranlib/strip
          ln -sf "$TOOLCHAIN_BIN/${CROSS_TRIPLE}-clang" "$TOOLCHAIN_BIN/${CROSS_TRIPLE}-gcc"
          ln -sf "$TOOLCHAIN_BIN/${CROSS_TRIPLE}-clang++" "$TOOLCHAIN_BIN/${CROSS_TRIPLE}-g++"
          for tool in ar ranlib nm strip objcopy; do
            ln -sf "$LLVM_BIN/llvm-$tool" "$TOOLCHAIN_BIN/${CROSS_TRIPLE}-$tool"
          done

          echo "OHOS_LLVM_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"
          echo "OHOS_CROSS_PREFIX=$TOOLCHAIN_BIN/${CROSS_TRIPLE}-" >> "$GITHUB_ENV"
          echo "PATH=$TOOLCHAIN_BIN:$PATH" >> "$GITHUB_ENV"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          echo "NDK: $NDK"
          "$TOOLCHAIN_BIN/${CROSS_TRIPLE}-clang" --version
          df -h /

      - name: Prepare cross toolchain files
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_ROOT/toolchain" "$DEPS/lib/pkgconfig" "$DEPS/include"
          NDK="$OHOS_NDK_HOME"
          SYSROOT="$NDK/sysroot"
          # 目标 CPU / sysroot ABI 目录随 matrix 变化：aarch64 或 x86_64
          TARGET_CPU="${CROSS_TRIPLE%%-*}"
          ABI_TRIPLE="$TARGET_CPU-linux-ohos"
          CC="$OHOS_LLVM_BIN/${CROSS_TRIPLE}-clang"
          CXX="$OHOS_LLVM_BIN/${CROSS_TRIPLE}-clang++"
          AR="$NDK/llvm/bin/llvm-ar"
          RANLIB="$NDK/llvm/bin/llvm-ranlib"
          NM="$NDK/llvm/bin/llvm-nm"
          STRIP="$NDK/llvm/bin/llvm-strip"
          LD="$NDK/llvm/bin/ld.lld"

          # pkg-config 包装：只搜索 staged 前缀与 OHOS sysroot
          PC_WRAPPER="$BUILD_ROOT/toolchain/ohos-pkg-config"
          cat > "$PC_WRAPPER" <<EOF
          #!/bin/sh
          unset PKG_CONFIG_SYSROOT_DIR PKG_CONFIG_PATH
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig:$DEPS/share/pkgconfig"
          exec pkg-config "\$@"
          EOF
          chmod +x "$PC_WRAPPER"
          # QEMU/Meson 会按 cross-prefix 查找 <triple>-pkg-config
          CROSS_BIN_DIR="$(dirname "$OHOS_CROSS_PREFIX")"
          ln -sf "$PC_WRAPPER" "$CROSS_BIN_DIR/${CROSS_TRIPLE}-pkg-config"

          cat > "$BUILD_ROOT/toolchain/ohos-meson.ini" <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = '$PC_WRAPPER'
          ld = '$LD'
          cmake = 'cmake'
          python = 'python3'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['--target=$OHOS_TARGET_TRIPLE', '--sysroot=$SYSROOT', '-fPIC']
          cpp_args = ['--target=$OHOS_TARGET_TRIPLE', '--sysroot=$SYSROOT', '-fPIC']
          c_link_args = ['--target=$OHOS_TARGET_TRIPLE', '--sysroot=$SYSROOT', '-fuse-ld=lld']
          cpp_link_args = ['--target=$OHOS_TARGET_TRIPLE', '--sysroot=$SYSROOT', '-fuse-ld=lld']

          [host_machine]
          system = 'linux'
          cpu_family = '$TARGET_CPU'
          cpu = '$TARGET_CPU'
          endian = 'little'
          EOF

          cat > "$BUILD_ROOT/toolchain/ohos-cmake.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR $TARGET_CPU)
          set(CMAKE_SYSROOT "$SYSROOT")
          set(CMAKE_C_COMPILER "$CC")
          set(CMAKE_CXX_COMPILER "$CXX")
          set(CMAKE_C_COMPILER_TARGET "$OHOS_TARGET_TRIPLE")
          set(CMAKE_CXX_COMPILER_TARGET "$OHOS_TARGET_TRIPLE")
          set(CMAKE_AR "$AR")
          set(CMAKE_RANLIB "$RANLIB")
          set(CMAKE_NM "$NM")
          set(CMAKE_STRIP "$STRIP")
          set(CMAKE_C_FLAGS_INIT "--target=$OHOS_TARGET_TRIPLE --sysroot=$SYSROOT -fPIC")
          set(CMAKE_CXX_FLAGS_INIT "--target=$OHOS_TARGET_TRIPLE --sysroot=$SYSROOT -fPIC")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "--target=$OHOS_TARGET_TRIPLE --sysroot=$SYSROOT -fuse-ld=lld")
          set(CMAKE_FIND_ROOT_PATH "$DEPS" "$SYSROOT")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF

          # OHOS 的 EGL / GLES 开发文件不一定带 .pc，补两份最小描述给
          # libepoxy / virglrenderer / QEMU 使用。
          for name in egl:EGL/egl.h:EGL:libEGL glesv2:GLES2/gl2.h:GLES2:libGLESv2 glesv3:GLES3/gl3.h:GLES3:libGLESv3; do
            IFS=: read -r pc header incdir libname <<< "$name"
            cat > "$DEPS/lib/pkgconfig/$pc.pc" <<EOF
          prefix=$SYSROOT/usr
          exec_prefix=\${prefix}
          libdir=$SYSROOT/usr/lib/$ABI_TRIPLE
          includedir=$SYSROOT/usr/include
          Name: $pc
          Description: HarmonyOS $pc
          Version: 1.0
          Libs: -L\${libdir} -l${libname#lib}
          Cflags: -I\${includedir} -I\${includedir}/$incdir
          EOF
          done

          # iconv 在 OHOS libc 中，提供 pc 避免 GLib 改用宿主 CMake 查找
          cat > "$DEPS/lib/pkgconfig/iconv.pc" <<EOF
          prefix=$SYSROOT/usr
          includedir=$SYSROOT/usr/include
          Name: iconv
          Description: HarmonyOS libc iconv
          Version: 1.0
          Libs:
          Cflags: -I\${includedir}
          EOF

      - name: Build OHOS dependencies
        run: |
          set -euo pipefail
          NDK="$OHOS_NDK_HOME"
          SYSROOT="$NDK/sysroot"
          TARGET_CPU="${CROSS_TRIPLE%%-*}"
          CC="$OHOS_LLVM_BIN/${CROSS_TRIPLE}-clang"
          CXX="$OHOS_LLVM_BIN/${CROSS_TRIPLE}-clang++"
          AR="$NDK/llvm/bin/llvm-ar"
          RANLIB="$NDK/llvm/bin/llvm-ranlib"
          NM="$NDK/llvm/bin/llvm-nm"
          STRIP="$NDK/llvm/bin/llvm-strip"
          MESON_CROSS="$BUILD_ROOT/toolchain/ohos-meson.ini"
          CMAKE_TOOLCHAIN="$BUILD_ROOT/toolchain/ohos-cmake.cmake"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig:$DEPS/share/pkgconfig"
          export PKG_CONFIG_PATH=

          fetch() {
            local name="$1" url="$2"
            local file="/tmp/${name}.tar.gz"
            if [ ! -d "$BUILD_ROOT/src/$name" ]; then
              mkdir -p "$BUILD_ROOT/src"
              curl -L --retry 3 --fail -o "$file" "$url"
              mkdir -p "$BUILD_ROOT/src/$name"
              tar -xf "$file" -C "$BUILD_ROOT/src/$name" --strip-components=1
            fi
          }

          meson_build() {
            local name="$1"; shift
            local src="$BUILD_ROOT/src/$name"
            local dir="$BUILD_ROOT/build/$name"
            rm -rf "$dir"
            meson setup "$dir" "$src" \
              --cross-file "$MESON_CROSS" \
              --prefix "$DEPS" --libdir lib \
              --buildtype release --default-library static "$@"
            ninja -C "$dir"
            ninja -C "$dir" install
          }

          cmake_build() {
            local name="$1"; shift
            local src="$BUILD_ROOT/src/$name"
            local dir="$BUILD_ROOT/build/$name"
            rm -rf "$dir"
            cmake -S "$src" -B "$dir" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN" \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_INSTALL_INCLUDEDIR=include \
              -DCMAKE_BUILD_TYPE=Release "$@"
            cmake --build "$dir" -j "$(nproc)"
            cmake --install "$dir"
          }

          # zlib / libffi / pcre2 / glib / pixman
          fetch "zlib-$ZLIB_VERSION" "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz"
          cmake_build "zlib-$ZLIB_VERSION" -DBUILD_SHARED_LIBS=OFF
          # 显式写入 zlib.pc，避免 GLib 回退到 CMake 找到宿主 zlib（-I/usr/include）
          mkdir -p "$DEPS/lib/pkgconfig"
          cat > "$DEPS/lib/pkgconfig/zlib.pc" <<EOF
          prefix=$DEPS
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: zlib
          Description: zlib compression library
          Version: $ZLIB_VERSION
          Libs: -L\${libdir} -lz
          Cflags: -I\${includedir}
          EOF
          test -f "$DEPS/include/zlib.h"
          test -f "$DEPS/lib/libz.a"
          grep -q "Name: zlib" "$DEPS/lib/pkgconfig/zlib.pc"
          test "$("$BUILD_ROOT/toolchain/ohos-pkg-config" --modversion zlib)" = "$ZLIB_VERSION"

          fetch "libffi-$LIBFFI_VERSION" "https://github.com/libffi/libffi/releases/download/v${LIBFFI_VERSION}/libffi-${LIBFFI_VERSION}.tar.gz"
          (
            cd "$BUILD_ROOT/src/libffi-$LIBFFI_VERSION"
            ./configure --host=${TARGET_CPU}-linux-gnu --prefix="$DEPS" \
              --enable-static --disable-shared --disable-docs \
              CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" \
              CFLAGS="--target=$OHOS_TARGET_TRIPLE --sysroot=$SYSROOT -fPIC" \
              LDFLAGS="--target=$OHOS_TARGET_TRIPLE --sysroot=$SYSROOT -fuse-ld=lld"
            make -j "$(nproc)"
            make install
          )

          fetch "pcre2-$PCRE2_VERSION" "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE2_VERSION}/pcre2-${PCRE2_VERSION}.tar.gz"
          cmake_build "pcre2-$PCRE2_VERSION" \
            -DBUILD_SHARED_LIBS=OFF \
            -DPCRE2_BUILD_PCRE2_16=OFF -DPCRE2_BUILD_PCRE2_32=OFF \
            -DPCRE2_BUILD_TESTS=OFF -DPCRE2_BUILD_PCRE2GREP=OFF \
            -DPCRE2_SUPPORT_JIT=OFF

          # GLib 只提供 .tar.xz 发布包
          if [ ! -d "$BUILD_ROOT/src/glib-$GLIB_VERSION" ]; then
            curl -L --retry 3 --fail -o /tmp/glib.tar.xz "https://download.gnome.org/sources/glib/2.80/glib-${GLIB_VERSION}.tar.xz"
            mkdir -p "$BUILD_ROOT/src/glib-$GLIB_VERSION"
            tar -xJf /tmp/glib.tar.xz -C "$BUILD_ROOT/src/glib-$GLIB_VERSION" --strip-components=1
          fi
          meson_build "glib-$GLIB_VERSION" \
            -Dtests=false -Dinstalled_tests=false \
            -Dintrospection=disabled -Dsysprof=disabled \
            -Ddocumentation=false -Dman-pages=disabled \
            -Dselinux=disabled -Dxattr=false -Dlibmount=disabled -Dlibelf=disabled \
            -Dnls=disabled -Dglib_debug=disabled -Dglib_assert=false -Dglib_checks=false

          fetch "pixman-$PIXMAN_VERSION" "https://cairographics.org/releases/pixman-${PIXMAN_VERSION}.tar.gz"
          meson_build "pixman-$PIXMAN_VERSION" \
            -Dgtk=disabled -Dlibpng=disabled -Dtests=disabled -Ddemos=disabled \
            -Dopenmp=disabled -Dgnuplot=false -Dtimers=false

          # OpenSSL（SPICE 需要）
          fetch "openssl-$OPENSSL_VERSION" "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          (
            cd "$BUILD_ROOT/src/openssl-$OPENSSL_VERSION"
            # linux-x86_64 目标带 multilib=64，默认装到 lib64；统一装到 lib，
            # 否则后续 -L$DEPS/lib 找不到 libssl.a / libcrypto.a
            ./Configure "$OPENSSL_TARGET" --prefix="$DEPS" --openssldir="$DEPS/ssl" \
              --libdir=lib \
              no-shared no-tests -fPIC \
              CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" NM="$NM"
            make -j "$(nproc)"
            make install_sw
            test -f "$DEPS/lib/libssl.a"
            test -f "$DEPS/lib/libcrypto.a"
          )

          # libjpeg-turbo（SPICE 的 MJPEG 编码需要）
          fetch "libjpeg-turbo-$JPEG_VERSION" "https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/${JPEG_VERSION}.tar.gz"
          cmake_build "libjpeg-turbo-$JPEG_VERSION" \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
            -DWITH_SIMD=OFF -DWITH_TURBOJPEG=OFF
          # spice-common / spice-server 里 jpeg 的探测名是 "jpeg"（不是 "libjpeg"）。
          # 只提供 libjpeg.pc 时 Meson 会回退到 CMake 的 FindJPEG，把宿主
          # /usr/include 加进交叉编译的 include 路径，与 OHOS sysroot 的
          # stdint.h 冲突（bits/libc-header-start.h 找不到）。
          for pcname in libjpeg jpeg; do
            cat > "$DEPS/lib/pkgconfig/$pcname.pc" <<EOF
          prefix=$DEPS
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: $pcname
          Description: JPEG image codec
          Version: $JPEG_VERSION
          Libs: -L\${libdir} -ljpeg
          Cflags: -I\${includedir}
          EOF
          done
          test -f "$DEPS/lib/pkgconfig/libjpeg.pc"
          test -f "$DEPS/lib/pkgconfig/jpeg.pc"
          test -f "$DEPS/lib/libjpeg.a"
          test "$("$BUILD_ROOT/toolchain/ohos-pkg-config" --modversion jpeg)" = "$JPEG_VERSION"

          # libdrm / libepoxy / virglrenderer
          if [ ! -d "$BUILD_ROOT/src/libdrm-$LIBDRM_VERSION" ]; then
            curl -L --retry 3 --fail -o /tmp/libdrm.tar.xz "https://dri.freedesktop.org/libdrm/libdrm-${LIBDRM_VERSION}.tar.xz"
            mkdir -p "$BUILD_ROOT/src/libdrm-$LIBDRM_VERSION"
            tar -xJf /tmp/libdrm.tar.xz -C "$BUILD_ROOT/src/libdrm-$LIBDRM_VERSION" --strip-components=1
          fi
          meson_build "libdrm-$LIBDRM_VERSION" \
            -Dtests=false -Dman-pages=disabled -Dvalgrind=disabled \
            -Dradeon=disabled -Damdgpu=disabled -Dnouveau=disabled \
            -Dvmwgfx=disabled -Dintel=disabled -Detnaviv=disabled -Dvc4=disabled

          fetch "libepoxy-$EPOXY_VERSION" "https://github.com/anholt/libepoxy/archive/refs/tags/${EPOXY_VERSION}.tar.gz"
          meson_build "libepoxy-$EPOXY_VERSION" \
            -Dtests=false -Ddocs=false \
            -Dglx=no -Dx11=false -Degl=yes

          # OHOS 没有 gbm；virglrenderer 一旦发现 libdrm 就会强制依赖 gbm。
          # 构建 virglrenderer 时临时隐藏 libdrm.pc，构建完再恢复。
          mv "$DEPS/lib/pkgconfig/libdrm.pc" "$BUILD_ROOT/libdrm.pc.bak"
          if [ -f "$DEPS/lib/pkgconfig/libdrm_freedreno.pc" ]; then
            mv "$DEPS/lib/pkgconfig/libdrm_freedreno.pc" "$BUILD_ROOT/libdrm_freedreno.pc.bak"
          fi
          fetch "virglrenderer-$VIRGL_VERSION" "https://gitlab.freedesktop.org/virgl/virglrenderer/-/archive/${VIRGL_VERSION}/virglrenderer-${VIRGL_VERSION}.tar.gz"
          meson_build "virglrenderer-$VIRGL_VERSION" \
            -Dplatforms=egl \
            -Dvenus=false \
            -Dminigbm_allocation=false \
            -Ddrm=disabled \
            -Dtests=false
          mv "$BUILD_ROOT/libdrm.pc.bak" "$DEPS/lib/pkgconfig/libdrm.pc"
          if [ -f "$BUILD_ROOT/libdrm_freedreno.pc.bak" ]; then
            mv "$BUILD_ROOT/libdrm_freedreno.pc.bak" "$DEPS/lib/pkgconfig/libdrm_freedreno.pc"
          fi

          # 诊断：交叉编译用的 pc 不应指向宿主系统头目录，命中则打印出来
          grep -l 'includedir=/usr' "$DEPS"/lib/pkgconfig/*.pc || true

          # SPICE
          fetch "spice-protocol-$SPICE_PROTOCOL_VERSION" "https://gitlab.freedesktop.org/spice/spice-protocol/-/archive/v${SPICE_PROTOCOL_VERSION}/spice-protocol-v${SPICE_PROTOCOL_VERSION}.tar.gz"
          meson_build "spice-protocol-$SPICE_PROTOCOL_VERSION"

          fetch "spice-$SPICE_VERSION" "https://gitlab.freedesktop.org/spice/spice/-/archive/v${SPICE_VERSION}/spice-v${SPICE_VERSION}.tar.gz"
          # GitLab 源码包不含 submodule；按 spice v0.15.2 记录的 commit 补齐 spice-common
          SPICE_COMMON_COMMIT=58d375e5eadc6fb9e587e99fd81adcb95d01e8d6
          SPICE_COMMON_DIR="$BUILD_ROOT/src/spice-$SPICE_VERSION/subprojects/spice-common"
          if [ ! -f "$SPICE_COMMON_DIR/meson.build" ]; then
            mkdir -p "$SPICE_COMMON_DIR"
            curl -L --retry 3 --fail -o /tmp/spice-common.tar.gz \
              "https://gitlab.freedesktop.org/spice/spice-common/-/archive/${SPICE_COMMON_COMMIT}/spice-common-${SPICE_COMMON_COMMIT}.tar.gz"
            tar -xzf /tmp/spice-common.tar.gz -C "$SPICE_COMMON_DIR" --strip-components=1
            rm -f /tmp/spice-common.tar.gz
          fi
          test -f "$SPICE_COMMON_DIR/meson.build"
          meson_build "spice-$SPICE_VERSION" \
            -Dtests=false -Dmanual=false \
            -Dgstreamer=no -Dlz4=false -Dsasl=false \
            -Dopus=disabled -Dsmartcard=disabled -Dinstrumentation=no \
            -Dspice-common:python-checks=false
          # 源码包没有 .git，spice 的 meson 版本会变成 UNKNOWN，QEMU 要求 >=0.15.0
          SPICE_PC="$(find "$DEPS" -name 'spice-server.pc' -print -quit)"
          test -n "$SPICE_PC"
          sed -i "s/^Version:.*/Version: $SPICE_VERSION/" "$SPICE_PC"
          grep -q "^Version: $SPICE_VERSION" "$SPICE_PC"

      - name: Build SDL2 (ohos_sdl2)
        run: |
          set -euo pipefail
          NDK="$OHOS_NDK_HOME"

          # App 的 ArkTS 侧用的是 XComponent(NODE) + createNativeNode / setScaledDensity
          # 这套 C-API，只有 ohos_sdl2_capi 分支提供；master 已改成 NodeContainer +
          # AdapterTs 的新模型，没有这两个接口，SDL 拿不到根节点会让 SDL_CreateWindow
          # 失败、QEMU 的 -display sdl 直接退出（表现就是 SDL 页面黑屏且 QEMU 未运行）。
          if [ ! -d "$BUILD_ROOT/src/ohos_sdl2" ]; then
            git clone --depth 1 --branch ohos_sdl2_capi \
              https://gitcode.com/CPF-ApplicationTPC/ohos_sdl2.git "$BUILD_ROOT/src/ohos_sdl2"
          fi

          # HarmonyOS 要求随包 so 文件名全小写，libSDL2.so 含大写字母会被 hvigor 拒绝。
          # 这里把上游产物名、soname 与 NAPI 模块名统一改成 sdl2：
          #   libsdl2.so + nm_modname "sdl2" + XComponent(libraryname: 'sdl2')
          SDL_CMAKE="$BUILD_ROOT/src/ohos_sdl2/CMakeLists.txt"
          SDL_OHOS_SRC="$BUILD_ROOT/src/ohos_sdl2/src/core/ohos/SDL_ohos.cpp"
          sed -i 's/OUTPUT_NAME "SDL2"/OUTPUT_NAME "sdl2"/' "$SDL_CMAKE"
          sed -i 's/\.nm_modname = "SDL2"/.nm_modname = "sdl2"/' "$SDL_OHOS_SRC"
          grep -q 'OUTPUT_NAME "sdl2"' "$SDL_CMAKE"
          grep -q '\.nm_modname = "sdl2"' "$SDL_OHOS_SRC"

          rm -rf "$BUILD_ROOT/build/sdl2"
          cmake -S "$BUILD_ROOT/src/ohos_sdl2/ohos-project/entry/src/main/cpp" \
            -B "$BUILD_ROOT/build/sdl2" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/ohos.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOHOS_ARCH=${OHOS_ARCH} -DOHOS_PLATFORM=OHOS \
            -DOHOS_PLATFORM_LEVEL=${OHOS_API_LEVEL} \
            -DOHOS_COMPATIBLE_SDK_VERSION=${OHOS_API_LEVEL}
          cmake --build "$BUILD_ROOT/build/sdl2" --target SDL2 -j "$(nproc)"

          SDL_LIB=$(find "$BUILD_ROOT/build/sdl2" -name 'libsdl2.so' -print -quit)
          test -n "$SDL_LIB"
          SDL_INCLUDE="$BUILD_ROOT/src/ohos_sdl2/include"
          test -f "$SDL_INCLUDE/SDL.h"
          SDL_CONFIG=$(find "$BUILD_ROOT/build/sdl2" -name 'SDL_config.h' -print -quit)
          test -n "$SDL_CONFIG"
          SDL_CONFIG_INCLUDE=$(dirname "$SDL_CONFIG")

          echo "SDL_LIB=$SDL_LIB" >> "$GITHUB_ENV"
          echo "SDL_LIBDIR=$(dirname "$SDL_LIB")" >> "$GITHUB_ENV"
          echo "SDL_INCLUDE=$SDL_INCLUDE" >> "$GITHUB_ENV"
          echo "SDL_CONFIG_INCLUDE=$SDL_CONFIG_INCLUDE" >> "$GITHUB_ENV"

          cat > "$DEPS/lib/pkgconfig/sdl2.pc" <<EOF
          prefix=$BUILD_ROOT/src/ohos_sdl2
          libdir=$(dirname "$SDL_LIB")
          includedir=$SDL_INCLUDE
          Name: sdl2
          Description: Simple DirectMedia Layer for OpenHarmony
          Version: 2.0.12
          Libs: -L\${libdir} -lsdl2
          Cflags: -I\${includedir} -I$SDL_CONFIG_INCLUDE
          EOF

      - name: Configure and build QEMU (host ${{ matrix.arch }}; guests x86_64 + aarch64, TCG)
        run: |
          set -euo pipefail
          NDK="$OHOS_NDK_HOME"
          SYSROOT="$NDK/sysroot"
          ABI_TRIPLE="${CROSS_TRIPLE%%-*}-linux-ohos"
          CC="$OHOS_LLVM_BIN/${CROSS_TRIPLE}-clang"
          CXX="$OHOS_LLVM_BIN/${CROSS_TRIPLE}-clang++"
          AR="$NDK/llvm/bin/llvm-ar"
          RANLIB="$NDK/llvm/bin/llvm-ranlib"
          NM="$NDK/llvm/bin/llvm-nm"
          STRIP="$NDK/llvm/bin/llvm-strip"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig:$DEPS/share/pkgconfig"
          export PKG_CONFIG_PATH=

          # 两个 softmmu 目标在同一次 configure/ninja 中构建（共享 libqemuutil 等公共对象）
          BUILD_DIR="$BUILD_ROOT/qemu"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          (
            cd "$BUILD_DIR"
            "${GITHUB_WORKSPACE}/qemu/configure" \
              --target-list="x86_64-softmmu,aarch64-softmmu" \
              --enable-tcg \
              --enable-sdl \
              --enable-spice \
              --enable-virglrenderer \
              --enable-opengl \
              --disable-gtk \
              --disable-kvm \
              --disable-hvf \
              --disable-whpx \
              --disable-xen \
              --disable-docs \
              --disable-tools \
              --disable-guest-agent \
              --disable-werror \
              -Dvhost_user=disabled \
              -Dvhost_user_blk_server=disabled \
              -Dvhost_vdpa=disabled \
              -Dlibvduse=disabled \
              -Dvduse_blk_export=disabled \
              -Dvhost_net=disabled \
              -Dvhost_kernel=disabled \
              -Dkeyring=disabled \
              -Dgzvm=disabled \
              -Dgunyah=disabled \
              --cross-prefix="$OHOS_CROSS_PREFIX" \
              --cc="$CC" --cxx="$CXX" --objcc="$CC" \
              --host-cc="$(command -v gcc)" \
              --extra-cflags="--target=$OHOS_TARGET_TRIPLE --sysroot=$SYSROOT -fPIC -I$DEPS/include -I$SDL_INCLUDE -I$SDL_CONFIG_INCLUDE" \
              --extra-ldflags="--target=$OHOS_TARGET_TRIPLE --sysroot=$SYSROOT -fuse-ld=lld -L$DEPS/lib -L$SDL_LIBDIR $NDK/llvm/lib/$ABI_TRIPLE/libc++.a $NDK/llvm/lib/$ABI_TRIPLE/libc++abi.a $NDK/llvm/lib/$ABI_TRIPLE/libunwind.a" \
              --prefix="$BUILD_DIR/install"
            ninja -j "$(nproc)"
            # 该静态库 build_by_default=false（可执行文件直接用对象链接），
            # 但后续把 QEMU 打成 .so 需要它，这里显式构建
            ninja libqemu-x86_64-softmmu.a libqemu-aarch64-softmmu.a
          )

      - name: Stage QEMU firmware for HAP
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/qemu/pc-bios"
          BUILD_DIR="$BUILD_ROOT/qemu"
          DEST="$GITHUB_WORKSPACE/dist/pc-bios"
          rm -rf "$DEST"
          mkdir -p "$DEST/keymaps"

          # x86_64 / aarch64 机器、显示与网卡 option ROM 所需的固件
          BLOBS=(
            bios.bin bios-256k.bin bios-microvm.bin qboot.rom
            ast27x0_bootrom.bin
            vgabios.bin vgabios-stdvga.bin vgabios-cirrus.bin vgabios-vmware.bin
            vgabios-qxl.bin vgabios-virtio.bin vgabios-ramfb.bin
            vgabios-bochs-display.bin vgabios-ati.bin
            efi-e1000.rom efi-e1000e.rom efi-eepro100.rom efi-ne2k_pci.rom
            efi-pcnet.rom efi-rtl8139.rom efi-virtio.rom efi-vmxnet3.rom
            pxe-e1000.rom pxe-eepro100.rom pxe-ne2k_pci.rom pxe-pcnet.rom
            pxe-rtl8139.rom pxe-virtio.rom
            kvmvapic.bin linuxboot_dma.bin multiboot_dma.bin pvh.bin
          )
          for f in "${BLOBS[@]}"; do
            test -f "$SRC/$f"
            cp "$SRC/$f" "$DEST/"
          done

          # EDK2 固件在构建目录中由 .bz2 解出；必要时直接解压源文件
          for f in edk2-x86_64-code.fd edk2-i386-code.fd edk2-aarch64-code.fd; do
            if [ -f "$BUILD_DIR/pc-bios/$f" ]; then
              cp "$BUILD_DIR/pc-bios/$f" "$DEST/"
            elif [ -f "$SRC/$f.bz2" ]; then
              bzip2 -dc "$SRC/$f.bz2" > "$DEST/$f"
            else
              echo "缺少 $f" >&2
              exit 1
            fi
          done

          cp -a "$SRC/keymaps/." "$DEST/keymaps/"
          test -f "$DEST/keymaps/en-us"

          # manifest 供运行时把 rawfile 里的固件复制到应用私有目录；
          # 首行的 QEMU 提交号可用于判断固件是否需要重新解包。
          {
            echo "# qemu=$(git -C "$GITHUB_WORKSPACE/qemu" rev-parse HEAD 2>/dev/null || echo unknown)"
            for f in "${BLOBS[@]}"; do echo "$f"; done
            echo "edk2-x86_64-code.fd"
            echo "edk2-i386-code.fd"
            echo "edk2-aarch64-code.fd"
            find "$DEST/keymaps" -maxdepth 1 -type f -printf 'keymaps/%f\n' | sort
          } > "$DEST/manifest.txt"

          test -f "$DEST/bios-256k.bin"
          test -f "$DEST/edk2-x86_64-code.fd"
          test -f "$DEST/edk2-aarch64-code.fd"
          ls -lh "$DEST" | sed -n '1,40p'
          du -sh "$DEST"

      - name: Link dlopen-able shared libraries
        run: |
          set -euo pipefail
          NDK="$OHOS_NDK_HOME"
          SYSROOT="$NDK/sysroot"
          ABI_TRIPLE="${CROSS_TRIPLE%%-*}-linux-ohos"
          CC="$OHOS_LLVM_BIN/${CROSS_TRIPLE}-clang"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          BUILD_DIR="$BUILD_ROOT/qemu"

          # 诊断：确认 QEMU 对象确实以 -fPIC 编译
          ninja -C "$BUILD_DIR" -t commands libcommon.a.p/cpu-common.c.o 2>/dev/null | tail -n 1 || true

          for TARGET in x86_64-softmmu aarch64-softmmu; do
            GUEST="${TARGET%-softmmu}"

            # QEMU 的可执行文件是直接把各模块的对象链接进去的
            # （executable(objects: lib.extract_all_objects(recursive: true))），
            # 而 qom / crypto / io / hwcore / monitor 等模块的 static_library 都设了
            # build_by_default=false，构建目录里根本不存在对应的 .a（顶层只有
            # libqemuutil.a，以及本 workflow 显式构建的每目标归档）。
            # 因此直接复用 QEMU 为 qemu-system-<guest> 生成的链接命令：取出其中的
            # .o/.a 与 -l/-L，改造成 -shared 输出，保证内部符号一个不漏。
            LINK_LINE="$(cd "$BUILD_DIR" && ninja -t commands "qemu-system-$GUEST" \
              | grep -E -- "-o qemu-system-$GUEST( |\$)" | tail -n 1)"
            if [ -z "$LINK_LINE" ]; then
              echo "无法从 ninja 取得 qemu-system-$GUEST 的链接命令" >&2
              exit 1
            fi
            read -r -a LINK_TOKENS <<< "$LINK_LINE"
            LINK_INPUTS=()
            for tok in "${LINK_TOKENS[@]}"; do
              case "$tok" in
                *.o|*.a|-l*|-L*|-Wl,--start-group|-Wl,--end-group) LINK_INPUTS+=("$tok") ;;
              esac
            done
            if [ ${#LINK_INPUTS[@]} -eq 0 ]; then
              echo "qemu-system-$GUEST 的链接命令里没有解析到输入文件" >&2
              exit 1
            fi
            echo "guest: $GUEST"
            echo "link inputs: ${#LINK_INPUTS[@]}"

            (
              cd "$BUILD_DIR"
              "$CC" -shared -fPIC \
                --target="$OHOS_TARGET_TRIPLE" --sysroot="$SYSROOT" -fuse-ld=lld \
                -o "$GITHUB_WORKSPACE/dist/libqemu-system-$GUEST.so" \
                "${LINK_INPUTS[@]}" \
                "$NDK/llvm/lib/$ABI_TRIPLE/libc++.a" \
                "$NDK/llvm/lib/$ABI_TRIPLE/libc++abi.a" \
                "$NDK/llvm/lib/$ABI_TRIPLE/libunwind.a" \
                -lEGL -lGLESv3 -lz -lm -lpthread -ldl \
                -Wl,--allow-shlib-undefined \
                -Wl,--no-undefined \
                -Wl,-soname,libqemu-system-$GUEST.so
            )

            file "$GITHUB_WORKSPACE/dist/libqemu-system-$GUEST.so"
            "$NDK/llvm/bin/llvm-nm" -D "$GITHUB_WORKSPACE/dist/libqemu-system-$GUEST.so" \
              | grep -E ' (qemu_init|qemu_main_loop|qemu_cleanup)$' || {
                echo "缺少 qemu_init/qemu_main_loop/qemu_cleanup 导出" >&2
                exit 1
              }

            # 内部符号必须被定义（否则 dlopen 时 BIND_NOW 会因未定义符号失败）
            for sym in AES_sbox Accelerator_lookup ImageFormat_lookup; do
              "$NDK/llvm/bin/llvm-nm" -D --defined-only \
                "$GITHUB_WORKSPACE/dist/libqemu-system-$GUEST.so" \
                | grep -q " $sym$" || {
                  echo "libqemu-system-$GUEST.so 缺少内部符号 $sym，通用静态归档未链全" >&2
                  exit 1
                }
            done
          done

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/pkgconfig
          cp "$DEPS/lib/pkgconfig/"*.pc dist/pkgconfig/ || true
          # Limbo 运行时同时需要 SDL2 的 N-API 库
          cp "$SDL_LIB" dist/libsdl2.so
          tar -czf "qemu-ohos-${OHOS_ARCH}-tcg.tar.gz" -C dist .
          ls -lh dist "qemu-ohos-${OHOS_ARCH}-tcg.tar.gz"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ohos-${{ matrix.arch }}-tcg
          path: |
            dist/libqemu-system-*.so
            dist/libsdl2.so
            dist/pc-bios
            dist/pkgconfig
            qemu-ohos-${{ matrix.arch }}-tcg.tar.gz
          if-no-files-found: error
          retention-days: 14

  # HAP 构建使用 harmonyos-ci 的 command-line-tools 镜像（API 26 正式版），
  # 公共 OpenHarmony SDK 没有 hms / API 26，无法满足本工程配置。
  # https://github.com/DaLongZhuaZi/harmonyos-ci
  hap:
    name: Build unsigned HAP
    needs: build
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/dalongzhuazi/harmonyos-ci:api26r
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Limbo
        uses: actions/checkout@v4

      - name: Download native libraries (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: qemu-ohos-arm64-v8a-tcg
          # 产物 artifact 内含 dist/ 前缀（上传时公共父目录是 workspace 根）
          path: native/arm64-v8a

      - name: Download native libraries (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: qemu-ohos-x86_64-tcg
          path: native/x86_64

      - name: Stage native libraries for HAP
        run: |
          set -euo pipefail
          for ABI in arm64-v8a x86_64; do
            test -d "native/$ABI/dist"
            mkdir -p "entry/libs/$ABI"
            cp "native/$ABI/dist/libqemu-system-x86_64.so" "entry/libs/$ABI/"
            cp "native/$ABI/dist/libqemu-system-aarch64.so" "entry/libs/$ABI/"
            cp "native/$ABI/dist/libsdl2.so" "entry/libs/$ABI/"
            ls -lh "entry/libs/$ABI"
          done

      - name: Stage QEMU firmware into HAP rawfile
        run: |
          set -euo pipefail
          test -d native/arm64-v8a/dist/pc-bios
          DEST=entry/src/main/resources/rawfile/qemu/pc-bios
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a native/arm64-v8a/dist/pc-bios/. "$DEST/"
          test -f "$DEST/bios-256k.bin"
          test -f "$DEST/edk2-x86_64-code.fd"
          test -f "$DEST/edk2-aarch64-code.fd"
          test -f "$DEST/manifest.txt"
          test -f "$DEST/keymaps/en-us"
          du -sh "$DEST"

      - name: Strip machine-local signing and test deps
        run: |
          set -euo pipefail
          # 测试依赖在 CI 不安装；assembleHap 不需要它们
          python3 - <<'PY'
          import json
          p = 'oh-package.json5'
          data = json.load(open(p, encoding='utf-8'))
          data['devDependencies'] = {}
          json.dump(data, open(p, 'w', encoding='utf-8'), indent=2)
          PY

          # 未配置签名时移除对不存在的 signingConfig 的引用
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('build-profile.json5')
          text = p.read_text(encoding='utf-8')
          text = text.replace('        "signingConfig": "default",\n', '')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: ohpm install --all

      - name: Build HAP (unsigned)
        run: |
          hvigorw assembleHap \
            --mode module \
            -p product=default \
            -p module=entry@default \
            -p buildMode=debug \
            --no-daemon \
            --stacktrace

      - name: Collect HAP
        run: |
          set -euo pipefail
          mkdir -p dist/hap
          find entry/build -name '*.hap' -exec cp -v {} dist/hap/ \;
          ls -lh dist/hap
          test -n "$(ls -A dist/hap)"

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: limbo-ohos-hap
          path: dist/hap/*.hap
          if-no-files-found: error
          retention-days: 14
